# nginx — MODO MANTENIMIENTO (temporal)
# Copia a /etc/nginx/sites-available/tareaenminutos.conf y enlaza, igual que nginx.conf.
# Sirve la página de mantenimiento con HTTP 503 en todas las rutas.
# IMPORTANTE: mantiene /.well-known/acme-challenge/ para que Let's Encrypt pueda
# renovar los certificados mientras el sitio está en mantenimiento.

server {
    listen 443 ssl http2;
    server_name tareaenminutos.com;

    ssl_certificate     /etc/letsencrypt/live/tareaenminutos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tareaenminutos.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Logos e íconos referenciados por la página (sirven desde staticfiles).
    location /static/ {
        alias /var/www/tareaenminutos/staticfiles/;
        access_log off;
    }

    location / {
        return 503;
    }

    error_page 503 @maintenance;
    location @maintenance {
        root /etc/nginx/maintenance/;
        try_files /index.html =503;
    }

    # Permitir renovación de certificados.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

# www -> no-www (redirige también durante mantenimiento).
server {
    listen 443 ssl http2;
    server_name www.tareaenminutos.com;

    ssl_certificate     /etc/letsencrypt/live/tareaenminutos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tareaenminutos.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://tareaenminutos.com$request_uri;
}

server {
    listen 80;
    server_name tareaenminutos.com www.tareaenminutos.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://tareaenminutos.com$request_uri;
    }
}