# nginx — Tarea en Minutos
# Copia a /etc/nginx/sites-available/tareaenminutos.conf y enlaza:
#   sudo ln -s /etc/nginx/sites-available/tareaenminutos.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Reemplaza tareaenminutos.com por tu dominio. Daphne escucha en 127.0.0.1:8000.

# HTTPS (genera el certificado con certbot --nginx o deja este bloque comentado y
# usa solo el bloque HTTP si aún no tienes TLS).
server {
    listen 443 ssl http2;
    server_name tareaenminutos.com www.tareaenminutos.com;

    # Rutas de certificado (Let's Encrypt via certbot).
    ssl_certificate     /etc/letsencrypt/live/tareaenminutos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tareaenminutos.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Subir límite de body (máx 20MB según settings) para subida de documentos.
    client_max_body_size 25m;

    # WebSockets: chat y notificaciones (necesario para el encabezado Upgrade).
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Todo lo demás (HTTP + WebSockets pasan por Daphne/ASGI).
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media subida por usuarios (whitenoise NO sirve /media/, lo hace nginx).
    # Los nombres de archivo subidos son únicos; una caché de 1 año es segura.
    location /media/ {
        alias /var/www/tareaenminutos/media/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000";
        access_log off;
    }

    # Estáticos: los sirve nginx directamente (más rápido que Daphne), con caché
    # inmutable de 1 año y compresión. Whitenoise con ManifestStorage genera
    # nombres con hash (collectstatic) y deja versiones .gz en STATIC_ROOT, así
    # que `immutable` es seguro: al desplegar, los nuevos archivos tienen otro nombre.
    location /static/ {
        alias /var/www/tareaenminutos/staticfiles/;
        gzip_static on;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}

# Redirigir HTTP -> HTTPS (certbot lo suele gestionar; este es un fallback).
server {
    listen 80;
    server_name tareaenminutos.com www.tareaenminutos.com;

    # Servir /.well-known/acme-challenge/ para el desafío de Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
