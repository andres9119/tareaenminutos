{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - Tarea en Minutos</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-base: #000000;
            --bg-surface: rgba(10, 10, 10, 0.75);
            --primary: #06aa44;
            --secondary: #0891b2;
            --highlight: #ef4444;
            --text-main: #fefefe;
            --text-muted: #94a3b8;
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --border-glow: rgba(6, 170, 68, 0.18);
            --border-radius-lg: 16px;
            --border-radius-md: 10px;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        /* Animated Abstract Background */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(6, 170, 68, 0.12) 0%, transparent 70%);
            top: -100px;
            left: -100px;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(8, 145, 178, 0.1) 0%, transparent 70%);
            bottom: -150px;
            right: -100px;
            z-index: 0;
        }

        .login-container {
            background: var(--bg-surface);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-glow);
            padding: 3.5rem 3rem;
            border-radius: var(--border-radius-lg);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-header         .login-logo {
            margin-bottom: 1.2rem;
            display: flex;
            justify-content: center;
        }
        .login-logo-img {
            max-width: 160px;
            height: auto;
            display: block;
        }

        .login-header h1 {
            font-family: var(--font-heading);
            color: var(--text-main);
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 1.8rem;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.6rem;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: var(--transition-smooth);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 3.2rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-glow);
            border-radius: var(--border-radius-md);
            font-family: var(--font-body);
            color: var(--text-main);
            font-size: 1rem;
            transition: var(--transition-smooth);
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(6, 170, 68, 0.25);
            background: #0a0a0a;
        }

        input[type="text"]:focus + i,
        input[type="password"]:focus + i {
            color: var(--primary);
        }

        #password {
            padding-right: 3rem;
        }

        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }

        .password-toggle {
            position: absolute;
            right: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 0.25rem;
            line-height: 1;
            transition: var(--transition-smooth);
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        .submit-btn {
            width: 100%;
            padding: 0.95rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--border-radius-md);
            font-family: var(--font-heading);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-smooth);
            margin-top: 0.5rem;
            box-shadow: 0 4px 15px rgba(6, 170, 68, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(6, 170, 68, 0.5);
        }

        .messages {
            margin-bottom: 1.8rem;
        }

        .error-message {
            background: rgba(244, 63, 94, 0.15);
            color: var(--highlight);
            padding: 0.9rem 1.2rem;
            border-radius: var(--border-radius-md);
            border-left: 4px solid var(--highlight);
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .back-link {
            text-align: center;
            margin-top: 2rem;
        }

        .back-link a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-link a:hover {
            color: var(--primary);
        }

        .back-link a i {
            transition: var(--transition-smooth);
        }

        .back-link a:hover i {
            transform: translateX(-4px);
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2.5rem 2rem;
            }

            .login-header h1 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">
                <img src="{% static 'main_app/images/logo_blanco.png' %}" alt="Tarea en Minutos" class="login-logo-img">
            </div>
            <p>Acceso exclusivo para nuestra red de tutores</p>
        </div>

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="error-message">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Usuario</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required autocomplete="username">
                    <i class="fas fa-user"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="Ingresa tu clave" required autocomplete="current-password">
                    <i class="fas fa-lock"></i>
                    <button type="button" class="password-toggle" id="togglePassword" aria-label="Mostrar contraseña">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <span>Ingresar</span>
                <i class="fas fa-arrow-right-to-bracket"></i>
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="{% url 'password_reset' %}" style="color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: var(--transition-smooth);">
                <i class="fas fa-lock-open"></i> ¿Olvidaste tu contraseña?
            </a>
        </div>

        <div class="back-link">
            <a href="/"><i class="fas fa-arrow-left"></i> Volver a inicio</a>
        </div>
    </div>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const oculta = passwordInput.type === 'password';
            passwordInput.type = oculta ? 'text' : 'password';
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
            this.setAttribute('aria-label', oculta ? 'Ocultar contraseña' : 'Mostrar contraseña');
        });
    </script>
</body>
</html>
