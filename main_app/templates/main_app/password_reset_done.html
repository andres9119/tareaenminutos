{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlace enviado - Tarea en Minutos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-base: #000000;
            --bg-surface: rgba(10, 10, 10, 0.75);
            --primary: #06aa44;
            --text-main: #fefefe;
            --text-muted: #94a3b8;
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --border-glow: rgba(6, 170, 68, 0.18);
            --border-radius-lg: 16px;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body {
            font-family: var(--font-body);
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(6, 170, 68, 0.12) 0%, transparent 70%);
            top: -100px; left: -100px; z-index: 0;
        }
        body::after {
            content: '';
            position: absolute;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(8, 145, 178, 0.1) 0%, transparent 70%);
            bottom: -150px; right: -100px; z-index: 0;
        }
        .login-container {
            background: var(--bg-surface);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-glow);
            padding: 3.5rem 3rem;
            border-radius: var(--border-radius-lg);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
            animation: slideIn 0.5s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-header { text-align: center; margin-bottom: 1.5rem; }
        .login-header .login-logo { margin-bottom: 1.2rem; display: flex; justify-content: center; }
        .login-logo-img { max-width: 160px; height: auto; display: block; }
        .success-icon { text-align: center; font-size: 3rem; color: var(--primary); margin-bottom: 1rem; }
        .login-header h1 {
            font-family: var(--font-heading);
            font-size: 1.7rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            letter-spacing: -0.5px;
        }
        .info-text { color: var(--text-muted); text-align: center; line-height: 1.7; font-size: 0.95rem; }
        .back-link { text-align: center; margin-top: 2rem; }
        .back-link a {
            color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.95rem;
            transition: var(--transition-smooth); display: inline-flex; align-items: center; gap: 0.5rem;
        }
        .back-link a:hover { color: var(--primary); }
        @media (max-width: 480px) { .login-container { padding: 2.5rem 2rem; } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">
                <img src="{% static 'main_app/images/logo_blanco.png' %}" alt="Tarea en Minutos" class="login-logo-img">
            </div>
            <div class="success-icon"><i class="fas fa-envelope-circle-check"></i></div>
            <h1>Revisa tu correo</h1>
        </div>

        <p class="info-text">
            Si el correo o usuario pertenece a una cuenta de tutor activa,
            te hemos enviado un enlace para restablecer tu contraseña.
            Revisa tu bandeja de entrada (y la carpeta de spam) para continuar.
        </p>

        <div class="back-link">
            <a href="{% url 'login' %}"><i class="fas fa-arrow-left"></i> Volver a iniciar sesión</a>
        </div>
    </div>
</body>
</html>
